# Local production-like stack: pgvector + Redis + the API.
# Offline demo doesn't need this (the API defaults to in-memory + mock providers).
#   docker compose -f infra/docker-compose.yml up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omni
    ports: ["5432:5432"]
    volumes: ["omni_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ../backend
    ports: ["8000:8000"]
    environment:
      OMNI_STORE: pgvector
      DATABASE_URL: postgresql://omni:omni@db:5432/omni
      # Keep providers on mock unless you set real keys here:
      OMNI_STT: mock
      OMNI_EMBED: mock
      OMNI_LLM: mock
    depends_on:
      db:
        condition: service_healthy

volumes:
  omni_pg:
